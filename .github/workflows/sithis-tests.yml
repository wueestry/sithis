name: Sithis tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-api-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test --prefix packages/sithis
      - run: npm run demo --prefix packages/sithis
